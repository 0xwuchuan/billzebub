name: billzebub

x-app: &app
  image: billzebub:local
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  env_file:
    - ${BILLZEBUB_RUNTIME_ENV_FILE:-/volume1/docker/billzebub/runtime.env}
  environment:
    BILLZEBUB_ENVIRONMENT: nas
    BILLZEBUB_API_HOST: 0.0.0.0
    BILLZEBUB_API_PORT: "8000"
    BILLZEBUB_DATABASE_URL_FILE: /run/secrets/database-url
    BILLZEBUB_ARTIFACT_ROOT: /var/lib/billzebub/artifacts
    BILLZEBUB_STATEMENT_INBOX_ROOT: /var/lib/billzebub/inbox
    BILLZEBUB_STATEMENT_PASSWORD_ROOT: /run/secrets
    BILLZEBUB_TRUST_TAILSCALE_HEADERS: "true"
  volumes:
    - /volume1/docker/billzebub/artifacts:/var/lib/billzebub/artifacts:rw
    - /volume1/docker/billzebub/secrets:/run/secrets:ro
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: postgres:16.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: billzebub
      POSTGRES_USER: billzebub
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256
    volumes:
      - /volume1/docker/billzebub/postgres:/var/lib/postgresql/data:rw
      - /volume1/docker/billzebub/secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billzebub -d billzebub"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    mem_limit: 768m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  api:
    <<: *app
    networks:
      - default
      - proxy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).read()",
        ]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 20s
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    <<: *app
    command: ["billzebub-worker"]
    networks:
      - default
      - egress
    volumes:
      - /volume1/docker/billzebub/artifacts:/var/lib/billzebub/artifacts:rw
      - /volume1/billzebub-inbox:/var/lib/billzebub/inbox:rw
      - /volume1/docker/billzebub/secrets:/run/secrets:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from billzebub.config import Settings; from billzebub.persistence.database import Database; Database(Settings()).ping()",
        ]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 20s
    mem_limit: 768m
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    <<: *app
    profiles: ["maintenance"]
    command: ["billzebub", "migrate"]
    restart: "no"
    group_add:
      - "19999"
    volumes:
      - /volume1/docker/billzebub/artifacts:/var/lib/billzebub/artifacts:rw
      - /volume1/billzebub-inbox:/var/lib/billzebub/inbox:rw
      - /volume1/docker/billzebub/secrets:/run/secrets:ro
      - ${BILLZEBUB_APPLE_PROBE_CAPTURE_ROOT:-/volume1/docker/billzebub-apple-shortcut-probe/runtime/captures}:/import/apple-probe:ro
    depends_on:
      postgres:
        condition: service_healthy

networks:
  default:
    internal: true
  proxy:
    internal: false
  egress:
    # Worker HTTPS egress for Jev System One. No published ports.
    internal: false
