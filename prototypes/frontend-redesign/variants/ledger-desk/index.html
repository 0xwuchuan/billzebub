      }

      const LEDGE_HINTS = {
        overview: [
          ["g", "t", "ledger"],
          ["g", "r", "review inbox"],
        ],
        transactions: [
          ["j", "k", "move"],
          ["↵", null, "open detail"],
          ["f", null, "filters"],
        ],
        review: [
          ["j", "k", "move case"],
          ["1", "3", "decide"],
          ["x", null, "defer"],
        ],
        imports: [["↵", null, "open artifact"]],
        tokens: [],
      };

      function renderLedge() {
        const hints = LEDGE_HINTS[state.route] || [];
        const left = hints
          .map((hint) => {
            const keys =
              '<span class="kbd">' +
              hint[0] +
              "</span>" +
              (hint[1] ? '<span class="kbd">' + hint[1] + "</span>" : "");
            return '<span class="ledge__hint">' + keys + hint[2] + "</span>";
          })
          .join("");
        const totals = monthTotals();
        document.getElementById("ledge").innerHTML =
          left +
          '<span class="ledge__hint"><span class="kbd">⌘</span><span class="kbd">K</span>commands</span>' +
          '<span class="ledge__spacer"></span>' +
          '<span class="ledge__hint">Reporting currency SGD · estimated ' +
          money(totals.estimated) +
          " this month</span>";
      }

      /* ---------------------------------------------------------------
         ROUTER
         --------------------------------------------------------------- */
      const ROUTES = {};

      function go(route) {
        if (!ROUTES[route]) return;
        state.route = route;
        state.cursor = 0;
        closePalette();
        closeDrawer();
        window.scrollTo({ top: 0 });
        writeHash();
        render();
      }

      /* Deep links: every screen, queue, drawer and setup step is
         addressable, which is also how the review inbox gets linked from a
         notification later. */
      let hashLock = false;

      function writeHash() {
        hashLock = true;
        const suffix =
          state.route === "review" ? "/" + state.queue : "";
        window.history.replaceState(null, "", "#/" + state.route + suffix);
        window.setTimeout(() => (hashLock = false), 0);
      }

      function applyHash() {
        const parts = window.location.hash
          .replace(/^#\/?/, "")
          .split("/")
          .filter(Boolean);
        const head = parts[0];
        const arg = parts[1];

        if (head === "setup") {
          openSetup(arg === undefined ? 0 : Number(arg));
          return true;
        }
        if (head === "commands") {
          render();
          openPalette();
          return true;
        }
        if (head === "tx" && arg) {
          state.route = "transactions";
          render();
          openDrawer(arg);
          return true;
        }
        if (head === "review") {
          state.route = "review";
          if (arg && QUEUES.some((queue) => queue.id === arg))
            state.queue = arg;
          render();
          return true;
        }
        if (head && ROUTES[head]) {
          state.route = head;
          render();
          return true;
        }
        return false;
      }

      window.addEventListener("hashchange", () => {
        if (hashLock) return;
        applyHash();
      });

      function render(options) {
        const quiet = Boolean(options && options.quiet);
        renderSpine();
        renderTopbar();
        renderLedge();
        const canvas = document.getElementById("canvas");
        canvas.classList.toggle("is-quiet", quiet);
        canvas.innerHTML =
          '<div class="measure">' + ROUTES[state.route]() + "</div>";
        const fresh = !quiet && !state.seen[state.route];
        state.seen[state.route] = true;
        requestAnimationFrame(() => paintMeters(fresh));
      }

      /* An in-route update: same context, so no entrance motion. */
      function update() {
        render({ quiet: true });
      }

      /* Bars and meters ease out from rest to their value on the first frame
         after insert — once per route per session. A daily tool should not
         re-perform its charts every time you glance at them. */
      function paintMeters(animate) {
        document.querySelectorAll("[data-fill], [data-h]").forEach((node) => {
          if (!animate) node.style.transition = "none";
          if (node.dataset.fill)
            node.style.setProperty("--fill", node.dataset.fill);
          if (node.dataset.h) node.style.setProperty("--h", node.dataset.h);
        });
      }

      /* ---------------------------------------------------------------
         COMMAND PALETTE — the primary navigator of this direction
         --------------------------------------------------------------- */
      function commandItems() {
        const items = [];
        for (const item of NAV) {
          items.push({
            group: "Go to",
            label: item.label,
            hint: "g " + item.key.toLowerCase(),
            run: () => go(item.id),
          });
        }
        items.push({
          group: "Review",
          label: "Open Pending Review inbox",
          hint: "g r",
          run: () => go("review"),
        });
        items.push({
          group: "Review",
          label: "Categorize Shopee · S$132.40",
          run: () => {
            state.queue = "categorization";
            go("review");
          },
        });
        items.push({
          group: "Review",
          label: "Reprocess failed Extraction · dbs-live-fresh-2026-08.pdf",
          run: () => {
            state.queue = "imports";
            go("review");
          },
        });
        items.push({
          group: "Ledger",
          label: "Filter: provisional activity only",
          run: () => {
            state.filters.state = "provisional";
            go("transactions");
            toast("Filtered to provisional activity");
          },
        });
        items.push({
          group: "Ledger",
          label: "Filter: needs review",
          run: () => {
            state.filters.needsReview = true;
            go("transactions");
            toast("Filtered to Transactions with a Pending Review");
          },
        });
        for (const account of Object.values(ACCOUNTS)) {
          items.push({
            group: "Ledger",
            label: "Filter: " + account.name,
            run: () => {
              state.filters.account = account.id;
              go("transactions");
              toast("Filtered to " + account.name);
            },
          });
        }
        items.push({
          group: "Setup",
          label: state.setup.done
            ? "Re-run setup"
            : "Finish frontend setup (5 steps)",
          run: openSetup,
        });
        items.push({
          group: "Setup",
          label: "Add a Financial Account",
          run: () => openSetup(1),
        });
        items.push({
          group: "Setup",
          label: "Create an Apple Shortcut capture token",
          run: () => openSetup(3),
        });
        return items;
      }

      function openPalette() {
        state.palette.open = true;
        state.palette.query = "";
        state.palette.index = 0;
        const input = document.getElementById("palette-input");
        input.value = "";
        renderPalette();
        reveal(document.getElementById("scrim"));
        reveal(document.getElementById("palette"));
        input.focus();
      }

      function closePalette() {
        if (!state.palette.open) return;
        state.palette.open = false;
        const palette = document.getElementById("palette");
        palette.classList.remove("is-open");
        maybeHideScrim();
        window.setTimeout(
          () => {
            if (!state.palette.open) palette.hidden = true;
          },
          reduced.matches ? 10 : 160,
        );
      }

      /* Reveal an overlay: unhide, flush style so the transition has a real
         starting value, then switch to the open state. A forced reflow is
         more reliable than waiting a frame and costs one layout on an
         element that is about to be painted anyway. */
      function reveal(node) {
        node.hidden = false;
        void node.offsetWidth;
        node.classList.add("is-open");
      }

      function maybeHideScrim() {
        if (state.palette.open || state.drawer) return;
        const scrim = document.getElementById("scrim");
        scrim.classList.remove("is-open");
        window.setTimeout(
          () => {
            if (!state.palette.open && !state.drawer) scrim.hidden = true;
          },
          reduced.matches ? 10 : 180,
        );
      }

      function renderPalette() {
        const query = state.palette.query.trim().toLowerCase();
        const matches = commandItems().filter(
          (item) =>
            query === "" ||
            (item.group + " " + item.label).toLowerCase().includes(query),
        );
        state.palette.items = matches;
        if (state.palette.index >= matches.length) state.palette.index = 0;

        if (matches.length === 0) {
          document.getElementById("palette-list").innerHTML =
            '<p class="palette__empty">Nothing matches “' +
            esc(state.palette.query) +
            "”. Try an account name, “provisional”, or “setup”.</p>";
          return;
        }

        let html = "";
        let group = null;
        matches.forEach((item, index) => {
          if (item.group !== group) {
            group = item.group;
            html += '<div class="palette__group">' + esc(group) + "</div>";
          }
          html +=
            '<button class="palette__item" data-act="cmd" data-arg="' +
            index +
            '" role="option" aria-selected="' +
            (index === state.palette.index) +
            '" type="button"><span class="palette__glyph">' +
            icon("arrow") +
            "</span><span>" +
            esc(item.label) +
            "</span>" +
            (item.hint
              ? '<span class="palette__keys">' +
                item.hint
                  .split(" ")
                  .map((key) => '<span class="kbd">' + key + "</span>")
                  .join("") +
                "</span>"
              : "") +
            "</button>";
        });
        document.getElementById("palette-list").innerHTML = html;
        const active = document.querySelector(
          '.palette__item[aria-selected="true"]',
        );
        if (active) active.scrollIntoView({ block: "nearest" });
      }

      function runCommand(index) {
        const item = state.palette.items[index];
        if (!item) return;
        closePalette();
        window.setTimeout(() => item.run(), reduced.matches ? 0 : 80);
      }

      /* ---------------------------------------------------------------
         KEYBOARD — command-centric shell, so keys are the contract
         --------------------------------------------------------------- */
      let chord = null;

      document.addEventListener("keydown", (event) => {
        const key = event.key;
        const meta = event.metaKey || event.ctrlKey;

        if (meta && key.toLowerCase() === "k") {
          event.preventDefault();
          if (state.palette.open) closePalette();
          else openPalette();
          return;
        }

        if (state.palette.open) {
          if (key === "Escape") {
            event.preventDefault();
            closePalette();
          } else if (key === "ArrowDown" || (key === "n" && meta)) {
            event.preventDefault();
            state.palette.index =
              (state.palette.index + 1) % Math.max(state.palette.items.length, 1);
            renderPalette();
          } else if (key === "ArrowUp" || (key === "p" && meta)) {
            event.preventDefault();
            state.palette.index =
              (state.palette.index - 1 + state.palette.items.length) %
              Math.max(state.palette.items.length, 1);
            renderPalette();
          } else if (key === "Enter") {
            event.preventDefault();
            runCommand(state.palette.index);
          }
          return;
        }

        if (state.setup.open) {
          if (key === "Escape") {
            event.preventDefault();
            closeSetup();
          } else if (key === "Enter" && !isTyping(event.target)) {
            event.preventDefault();
            setupNext();
          }
          return;
        }

        if (key === "Escape") {
          if (state.drawer) {
            event.preventDefault();
            closeDrawer();
          }
          return;
        }

        if (isTyping(event.target)) return;

        if (chord === "g") {
          chord = null;
          const target = NAV.find(
            (item) => item.key.toLowerCase() === key.toLowerCase(),
          );
          if (target) {
            event.preventDefault();
            go(target.id);
          }
          return;
        }

        if (key === "g") {
          chord = "g";
          window.setTimeout(() => (chord = null), 900);
          return;
        }

        if (key === "j" || key === "ArrowDown") {
          event.preventDefault();
          moveCursor(1);
        } else if (key === "k" || key === "ArrowUp") {
          event.preventDefault();
          moveCursor(-1);
        } else if (key === "Enter") {
          const row = document.querySelector(".row.is-cursor");
          if (row) {
            event.preventDefault();
            row.click();
          }
        } else if (key === "f" && state.route === "transactions") {
          event.preventDefault();
          const search = document.getElementById("ledger-search");
          if (search) search.focus();
        } else if (state.route === "review" && /^[1-3]$/.test(key)) {
          const card = document.querySelector(".case.is-cursor");
          const choices = card
            ? card.querySelectorAll(".case__decide .choice")
            : [];
          const choice = choices[Number(key) - 1];
          if (choice) {
            event.preventDefault();
            choice.click();
          }
        } else if (key === "x" && state.route === "review") {
          const card = document.querySelector(".case.is-cursor");
          if (card) {
            event.preventDefault();
            toast("Deferred. The Pending Review stays in the queue.");
          }
        }
      });

      function isTyping(node) {
        return (
          node &&
          (node.tagName === "INPUT" ||
            node.tagName === "TEXTAREA" ||
            node.tagName === "SELECT" ||
            node.isContentEditable)
        );
      }

      function moveCursor(delta) {
        const selector = state.route === "review" ? ".case" : ".row";
        const nodes = [...document.querySelectorAll(selector)];
        if (nodes.length === 0) return;
        state.cursor = Math.max(
          0,
          Math.min(nodes.length - 1, state.cursor + delta),
        );
        nodes.forEach((node, index) =>
          node.classList.toggle("is-cursor", index === state.cursor),
        );
        nodes[state.cursor].scrollIntoView({ block: "nearest" });
      }

      /* ---------------------------------------------------------------
         DELEGATED ACTIONS
         --------------------------------------------------------------- */
      const ACTIONS = {
        route: (el) => go(el.dataset.arg),
        cmd: (el) => runCommand(Number(el.dataset.arg)),
        palette: openPalette,
        setup: () => openSetup(),
        tx: (el) => openDrawer(el.dataset.arg),
        artifact: (el) => openArtifact(el.dataset.arg),
        closeDrawer: closeDrawer,
        filterAccount: (el) => {
          state.filters.account = el.dataset.arg;
          update();
        },
        filterState: (el) => {
          state.filters.state = el.dataset.arg;
          update();
        },
        toggleNeedsReview: () => {
          state.filters.needsReview = !state.filters.needsReview;
          update();
        },
        clearFilters: () => {
          state.filters = { account: "all", state: "all", needsReview: false };
          state.query = "";
          update();
        },
        queue: (el) => {
          state.queue = el.dataset.arg;
          state.cursor = 0;
          if (state.route === "review") update();
          else go("review");
        },
        decide: (el) => decide(el.dataset.arg, el.dataset.choice, el.dataset.kind),
        setupNext: setupNext,
        setupBack: setupBack,
        setupSkip: () => {
          state.setup.step = Math.min(
            state.setup.step + 1,
            SETUP_STEPS.length - 1,
          );
          renderSetup();
        },
        setupClose: closeSetup,
        setupGoto: (el) => {
          state.setup.step = Number(el.dataset.arg);
          renderSetup();
        },
        setupToggle: (el) => {
          const data = state.setup.data;
          const key = el.dataset.arg;
          if (el.dataset.field === "accounts")
            data.accounts[key] = !data.accounts[key];
          else data[key] = !data[key];
          renderSetup();
        },
        setupPick: (el) => {
          state.setup.data[el.dataset.field] = el.dataset.arg;
          renderSetup();
        },
        probe: runProbe,
        extract: runExtraction,
        copyToken: () => {
          const token = "bz_pat_live_8Qk3R2vTn9YwLpAs";
          if (navigator.clipboard) navigator.clipboard.writeText(token);
          toast("Capture token copied to clipboard");
        },
        openInboxFromSetup: () => {
          closeSetup();
          state.queue = "categorization";
          go("review");
        },
        noop: () => {},
      };

      document.addEventListener("click", (event) => {
        const node = event.target.closest("[data-act]");
        if (!node) return;
        const action = ACTIONS[node.dataset.act];
        if (!action) return;
        action(node, event);
      });

      document.getElementById("cmd-open").addEventListener("click", openPalette);
      document.getElementById("scrim").addEventListener("click", () => {
        closePalette();
        closeDrawer();
      });
      document
        .getElementById("palette-input")
        .addEventListener("input", (event) => {
          state.palette.query = event.target.value;
          state.palette.index = 0;
          renderPalette();
        });

      /* Canvas inputs are delegated because routes re-render wholesale.
         Search repaints the ledger without replaying entrance motion, then
         restores the caret so typing never stutters. */
      document.addEventListener("input", (event) => {
        const node = event.target;
        if (node.id === "ledger-search") {
          const caret = node.selectionStart;
          state.query = node.value;
          update();
          const next = document.getElementById("ledger-search");
          if (next) {
            next.focus();
            next.setSelectionRange(caret, caret);
          }
        } else if (node.id === "path") {
          state.setup.data.path = node.value;
        }
      });

      state.seen = {};

      /* ---------------------------------------------------------------
         SHARED LEDGER MARKUP
         --------------------------------------------------------------- */
      function stateCell(tx) {
        if (txNeedsReview(tx))
          return '<span class="badge badge--provisional">Review</span>';
        if (tx.state === "provisional")
          return '<span class="badge badge--provisional">Provisional</span>';
        if (tx.kind === "Refund" || tx.kind === "Income")
          return '<span class="badge badge--confirmed">' +
            tx.kind +
            "</span>";
        if (tx.kind === "Transfer")
          return '<span class="badge badge--quiet">Transfer</span>';
        return '<span class="badge badge--confirmed">Confirmed</span>';
      }

      function categoryCell(tx) {
        const category = effectiveCategory(tx);
        if (category)
          return '<span class="tag">' + esc(category) + "</span>";
        if (tx.kind === "Transfer")
          return '<span class="tag">Not categorized</span>';
        if (tx.kind === "Income")
          return '<span class="tag">Income</span>';
        return '<span class="tag tag--empty">Category needed</span>';
      }

      function rowHtml(tx) {
        const amountClass =
          tx.amt > 0
            ? " is-positive"
            : tx.state === "provisional"
              ? " is-provisional"
              : "";
        return (
          '<button class="row" data-act="tx" data-arg="' +
          tx.id +
          '" type="button">' +
          '<span class="row__date bz-num">' +
          dayNum(tx.d) +
          " " +
          MONTHS[8] +
          "</span>" +
          '<span class="row__who"><span class="row__name">' +
          esc(tx.cp) +
          '</span><span class="row__raw">' +
          esc(tx.raw) +
          "</span></span>" +
          '<span class="row__meta">' +
          ACCOUNTS[tx.acc].label +
          "</span>" +
          '<span class="row__cat">' +
          categoryCell(tx) +
          "</span>" +
          '<span class="row__state">' +
          stateCell(tx) +
          "</span>" +
          '<span class="row__amount bz-num' +
          amountClass +
          '">' +
          money(tx.amt, { plus: tx.amt > 0 }) +
          "</span>" +
          "</button>"
        );
      }

      function ledgerHtml(list) {
        if (list.length === 0) {
          return (
            '<div class="empty">No Transactions match these filters.<br />' +
            '<button class="linkish" data-act="clearFilters" type="button">Clear filters</button></div>'
          );
        }
        let html = '<div class="ledger">';
        let day = null;
        for (const tx of list) {
          if (tx.d !== day) {
            day = tx.d;
            const dayTotal = list
              .filter((item) => item.d === day && item.kind === "Expense")
              .reduce((sum, item) => sum + Math.abs(item.amt), 0);
            html +=
              '<div class="ledger__daymark"><span>' +
              dayLabel(day) +
              "</span>" +
              '<span class="bz-num">' +
              money(-dayTotal) +
              "</span></div>";
          }
          html += rowHtml(tx);
        }
        return html + "</div>";
      }

      /* ---------------------------------------------------------------
         ROUTE — OVERVIEW (an editorial statement, not a card grid)
         --------------------------------------------------------------- */
      ROUTES.overview = function () {
        const totals = monthTotals();
        const pending = pendingReviews();
        const categories = categoryTotals();
        const max = categories.length > 0 ? categories[0].total : 1;
        const days = dailyTotals();
        const peak = Math.max(...days.map((entry) => entry.spend), 1);
        const blocking = pending.filter(
          (review) => review.severity === "blocking",
        ).length;

        const bars = days
          .map((entry) => {
            const height = Math.max(entry.spend / peak, 0.075).toFixed(3);
            const classes =
              "trend__bar" +
              (entry.iso === TODAY ? " is-today" : "") +
              (entry.isProvisional && entry.iso !== TODAY
                ? " is-provisional"
                : "");
            return (
              '<button class="' +
              classes +
              '" data-h="' +
              height +
              '" data-act="route" data-arg="transactions" type="button" title="' +
              shortDate(entry.iso) +
              " · " +
              money(-entry.spend) +
              '"><span class="bz-sr">' +
              shortDate(entry.iso) +
              " " +
              money(-entry.spend) +
              "</span></button>"
            );
          })
          .join("");

        const categoryRows = categories
          .slice(0, 6)
          .map((entry) => {
            const share = (entry.total / max).toFixed(3);
            return (
              '<button class="catrow" data-act="route" data-arg="transactions" type="button">' +
              '<span class="catrow__name">' +
              esc(entry.name) +
              "</span>" +
              '<span class="catrow__amount bz-num">' +
              money(-entry.total) +
              "</span>" +
              '<span class="catrow__bar"><span class="catrow__fill" data-fill="' +
              share +
              '"></span></span>' +
              "</button>"
            );
          })
          .join("");

        const decisionRows = [
          {
            label: "Categorization and Kind",
            count: pending.filter((review) => review.queue === "categorization")
              .length,
            queue: "categorization",
          },
          {
            label: "Unmatched Real-time Claims",
            count: pending.filter((review) => review.queue === "unmatched")
              .length,
            queue: "unmatched",
          },
          {
            label: "Reconciliation ambiguity",
            count: pending.filter((review) => review.queue === "reconciliation")
              .length,
            queue: "reconciliation",
          },
          {
            label: "Failed Extractions",
            count: pending.filter((review) => review.queue === "imports").length,
            queue: "imports",
          },
        ]
          .map((entry) => {
            const tone =
              entry.queue === "imports" && entry.count > 0
                ? "badge--failed"
                : entry.count > 0
                  ? "badge--provisional"
                  : "badge--confirmed";
            return (
              '<button class="catrow" data-act="queue" data-arg="' +
              entry.queue +
              '" type="button">' +
              '<span class="catrow__name">' +
              entry.label +
              "</span>" +
              '<span class="badge ' +
              tone +
              '">' +
              (entry.count > 0 ? entry.count + " pending" : "clear") +
              "</span></button>"
            );
          })
          .join("");

        const recent = TX.slice(0, 5).map(rowHtml).join("");

        return (
          "<section>" +
          '<div class="dateline"><span class="bz-eyebrow">September 2026</span>' +
          '<span class="bz-muted" style="font-size:var(--bz-size-sm)">1–13 Sep · Asia/Singapore · 3 Financial Accounts</span></div>' +
          '<h1 class="statement__lead">Your month so far reads clean. <em>Two Apple Pay captures are still provisional and ' +
          pending.length +
          " decisions are waiting.</em></h1>" +
          '<div class="figure"><span class="figure__currency">S$</span>' +
          '<span class="figure__value bz-num">' +
          plain(totals.estimated) +
          "</span>" +
          '<span class="bz-muted" style="font-size:var(--bz-size-sm)">estimated spend, net of one refund</span></div>' +
          '<div class="splitline"><span class="splitline__label"><span class="badge badge--confirmed">Confirmed</span>Statement-backed Transactions</span>' +
          '<span class="splitline__amount bz-num">' +
          money(-totals.confirmed) +
          "</span></div>" +
          '<div class="splitline"><span class="splitline__label"><span class="badge badge--provisional">Provisional</span>Eligible Real-time Claims</span>' +
          '<span class="splitline__amount bz-num">' +
          money(-totals.provisional) +
          "</span></div>" +
          '<div class="splitline"><span class="splitline__label"><span class="badge badge--quiet">Offsets</span>Refunds allocated against Expenses</span>' +
          '<span class="splitline__amount bz-num">' +
          money(totals.offsets, { plus: true }) +
          "</span></div>" +
          '<div style="display:flex;gap:var(--bz-s4);margin-top:var(--bz-s4)">' +
          '<button class="linkish" data-act="route" data-arg="transactions" type="button">Open the ledger →</button>' +
          '<button class="linkish" data-act="route" data-arg="review" type="button">Clear ' +
          pending.length +
          " Pending Review →</button></div>" +
          "</section>" +
          '<section class="section">' +
          '<div class="section__head"><h2 class="section__title">Daily spend</h2>' +
          '<span class="bz-muted" style="font-size:var(--bz-size-sm)">Peak ' +
          money(-peak) +
          " · today in cyan</span></div>" +
          '<div class="trend">' +
          bars +
          "</div>" +
          '<div class="trend__axis"><span>1 Sep</span><span>7 Sep</span><span>13 Sep</span></div>' +
          "</section>" +
          '<section class="section grid2">' +
          "<div>" +
          '<div class="section__head"><h2 class="section__title">Where it went</h2>' +
          '<span class="bz-muted" style="font-size:var(--bz-size-sm)">Top-level Categories</span></div>' +
          categoryRows +
          '<button class="linkish" data-act="route" data-arg="transactions" style="margin-top:var(--bz-s3)" type="button">All Categories in the ledger →</button>' +
          "</div>" +
          "<div>" +
          '<div class="section__head"><h2 class="section__title">Needs a decision</h2>' +
          (blocking > 0
            ? '<span class="badge badge--failed">' +
              blocking +
              " blocking</span>"
            : '<span class="badge badge--confirmed">nothing blocking</span>') +
          "</div>" +
          decisionRows +
          '<button class="linkish" data-act="route" data-arg="review" style="margin-top:var(--bz-s3)" type="button">Open the review inbox →</button>' +
          "</div>" +
          "</section>" +
          '<section class="section">' +
          '<div class="section__head"><h2 class="section__title">Latest activity</h2>' +
          '<button class="linkish" data-act="route" data-arg="transactions" type="button">All 24 Transactions →</button></div>' +
          '<div class="ledger">' +
          recent +
          "</div>" +
          "</section>"
        );
      };

      /* ---------------------------------------------------------------
         ROUTE — TRANSACTIONS (dense ledger)
         --------------------------------------------------------------- */
      ROUTES.transactions = function () {
        const query = state.query.trim().toLowerCase();
        const list = TX.filter((tx) => {
          if (
            state.filters.account !== "all" &&
            tx.acc !== state.filters.account
          )
            return false;
          if (state.filters.state === "provisional" && tx.state !== "provisional")
            return false;
          if (state.filters.state === "confirmed" && tx.state !== "confirmed")
            return false;
          if (state.filters.needsReview && !txNeedsReview(tx)) return false;
          if (
            query !== "" &&
            !(tx.cp + " " + tx.raw + " " + (effectiveCategory(tx) || ""))
              .toLowerCase()
              .includes(query)
          )
            return false;
          return true;
        });

        const spend = list
          .filter((tx) => tx.kind === "Expense")
          .reduce((sum, tx) => sum + Math.abs(tx.amt), 0);
        const provisionalCount = list.filter(
          (tx) => tx.state === "provisional",
        ).length;

        const accountPills = [
          { id: "all", label: "All accounts" },
          ...Object.values(ACCOUNTS).map((account) => ({
            id: account.id,
            label: account.name,
          })),
        ]
          .map(
            (entry) =>
              '<button class="pill" data-act="filterAccount" data-arg="' +
              entry.id +
              '" aria-pressed="' +
              (state.filters.account === entry.id) +
              '" type="button">' +
              entry.label +
              "</button>",
          )
          .join("");

        const statePills = [
          { id: "all", label: "Any state" },
          { id: "confirmed", label: "Confirmed" },
          { id: "provisional", label: "Provisional" },
        ]
          .map(
            (entry) =>
              '<button class="pill" data-act="filterState" data-arg="' +
              entry.id +
              '" aria-pressed="' +
              (state.filters.state === entry.id) +
              '" type="button">' +
              entry.label +
              "</button>",
          )
          .join("");

        return (
          "<section>" +
          '<div class="dateline"><span class="bz-eyebrow">Ledger</span>' +
          '<span class="bz-muted" style="font-size:var(--bz-size-sm)">Canonical Counterparty shown, raw provider text beneath</span></div>' +
          '<h1 class="statement__lead" style="font-size:var(--bz-size-xl)">' +
          list.length +
          " Transactions · " +
          money(-spend) +
          " · <em>" +
          provisionalCount +
          " provisional</em></h1>" +
          '<div class="toolbar">' +
          '<span class="toolbar__search"><input aria-label="Search the ledger" class="input" id="ledger-search" placeholder="Search Counterparty, raw text, Category…" type="search" value="' +
          esc(state.query) +
          '" /></span>' +
          '<button class="pill" data-act="toggleNeedsReview" aria-pressed="' +
          state.filters.needsReview +
          '" type="button">Needs review<span class="pill__count">' +
          TX.filter(txNeedsReview).length +
          "</span></button>" +
          '<button class="btn btn--ghost btn--sm" data-act="clearFilters" type="button">Reset</button>' +
          "</div>" +
          '<div class="toolbar" style="margin-top:calc(var(--bz-s4) * -1)">' +
          accountPills +
          '<span style="width:var(--bz-s2)"></span>' +
          statePills +
          "</div>" +
          ledgerHtml(list) +
          '<p class="bz-muted" style="margin-top:var(--bz-s4);font-size:var(--bz-size-sm)">' +
          "Amounts are Posted Amounts where a Statement Claim exists, otherwise Authorized Amounts. " +
          'Press <span class="kbd">↵</span> on a row to inspect its Claims.</p>' +
          "</section>"
        );
      };

      /* ---------------------------------------------------------------
         ROUTE — REVIEW (queued decisions, one case at a time)
         --------------------------------------------------------------- */
      const QUEUES = [
        { id: "categorization", label: "Categorization & Kind" },
        { id: "unmatched", label: "Unmatched Claims" },
        { id: "reconciliation", label: "Reconciliation" },
        { id: "imports", label: "Failed Extractions" },
      ];

      function caseSubject(review) {
        if (review.subject) {
          const tx = txFor(review.subject);
          return {
            name: tx.cp,
            amount: tx.amt,
            meta:
              longDate(tx.d) +
              " · " +
              ACCOUNTS[tx.acc].label +
              " · " +
              tx.kind,
            raw: tx.raw,
            evidence: [
              ["Statement Claim", "Posted " + money(tx.amt)],
              [
                "Real-time Claim",
                tx.rt ? "Apple Pay capture " + tx.rt : "none captured",
              ],
              ["Claim Disposition", "Confirmed"],
            ],
          };
        }
        if (review.claim) {
          const claim = claimFor(review.claim);
          return {
            name: claim.cp,
            amount: claim.amt,
            meta:
              longDate(claim.d) +
              " · " +
              ACCOUNTS[claim.acc].label +
              " · Real-time Claim",
            raw: claim.raw,
            evidence: [
              ["Captured", claim.captured],
              ["Authorized Amount", money(claim.amt)],
              ["Statement history", claim.since],
            ],
          };
        }
        const artifact = ARTIFACTS.find(
          (entry) => entry.id === review.artifact,
        );
        return {
          name: artifact.file,
          amount: null,
          meta:
            artifact.parser + " · " + artifact.period + " · Source Artifact",
          raw: artifact.detail,
          evidence: [
            ["Parser", artifact.parser],
            ["Claims created", "0 — Extraction rejected atomically"],
            ["Quarantined since", "1 Sep 2026, 03:12"],
          ],
        };
      }

      ROUTES.review = function () {
        const pending = pendingReviews();
        const queuePills = QUEUES.map((queue) => {
          const count = pending.filter(
            (review) => review.queue === queue.id,
          ).length;
          return (
            '<button class="pill" data-act="queue" data-arg="' +
            queue.id +
            '" aria-pressed="' +
            (state.queue === queue.id) +
            '" type="button">' +
            queue.label +
            '<span class="pill__count">' +
            count +
            "</span></button>"
          );
        }).join("");

        const cases = pending.filter(
          (review) => review.queue === state.queue,
        );

        const body =
          cases.length === 0
            ? '<div class="empty">This queue is clear.<br /><button class="linkish" data-act="route" data-arg="overview" type="button">Back to overview</button></div>'
            : cases
                .map((review, index) => {
                  const subject = caseSubject(review);
                  const choices = review.choices
                    .map(
                      (choice, choiceIndex) =>
                        '<button class="choice" data-act="decide" data-arg="' +
                        review.id +
                        '" data-choice="' +
                        esc(choice.label) +
                        '" data-kind="' +
                        choice.kind +
                        '" type="button"><span>' +
                        esc(choice.label) +
                        "</span>" +
                        (choiceIndex < 3
                          ? '<span class="kbd">' + (choiceIndex + 1) + "</span>"
                          : "") +
                        "</button>",
                    )
                    .join("");
                  return (
                    '<article class="case' +
                    (index === state.cursor ? " is-cursor" : "") +
                    '" data-case="' +
                    review.id +
                    '">' +
                    '<div class="case__head case__head--' +
                    review.severity +
                    '">' +
                    '<span class="badge badge--' +
                    (review.severity === "blocking" ? "failed" : "provisional") +
                    '">' +
                    review.severity +
                    "</span>" +
                    '<span class="case__title">' +
                    esc(review.title) +
                    "</span>" +
                    '<span class="bz-muted" style="margin-left:auto;font-size:var(--bz-size-xs)">' +
                    esc(subject.meta) +
                    "</span></div>" +
                    '<div class="case__body">' +
                    "<div>" +
                    '<div class="case__subject"><b>' +
                    esc(subject.name) +
                    "</b>" +
                    (subject.amount === null
                      ? ""
                      : '<span class="case__amount bz-num">' +
                        money(subject.amount, { plus: subject.amount > 0 }) +
                        "</span>") +
                    "</div>" +
                    '<p class="case__why">' +
                    esc(review.why) +
                    "</p>" +
                    '<div class="case__evidence" style="margin-top:var(--bz-s3)">' +
                    subject.evidence
                      .map(
                        (pair) =>
                          '<div style="display:flex;justify-content:space-between;gap:var(--bz-s3)"><span class="bz-muted">' +
                          esc(pair[0]) +
                          "</span><span>" +
                          esc(pair[1]) +
                          "</span></div>",
                      )
                      .join("") +
                    '<div class="claim__raw">' +
                    esc(subject.raw) +
                    "</div></div>" +
                    "</div>" +
                    '<div class="case__decide">' +
                    '<span class="bz-eyebrow">Permitted decisions</span>' +
                    choices +
                    '<button class="btn btn--ghost btn--sm" data-act="noop" style="margin-top:var(--bz-s1)" type="button">Defer <span class="kbd">x</span></button>' +
                    "</div>" +
                    "</div></article>"
                  );
                })
                .join("");

        return (
          "<section>" +
          '<div class="dateline"><span class="bz-eyebrow">Review inbox</span>' +
          '<span class="bz-muted" style="font-size:var(--bz-size-sm)">Every decision here is also available over HTTP and MCP</span></div>' +
          '<h1 class="statement__lead" style="font-size:var(--bz-size-xl)">' +
          (pending.length === 0
            ? "Nothing is waiting on you."
            : pending.length +
              " Pending Review · <em>" +
              cases.length +
              " in this queue</em>") +
          "</h1>" +
          '<div class="queuebar">' +
          queuePills +
          "</div>" +
          body +
          "</section>"
        );
      };

      function decide(reviewId, choice, kind) {
        const review = reviewFor(reviewId);
        if (!review) return;
        const category =
          kind === "category" ? choice.replace(/^Expense · /, "") : null;
        state.resolved[reviewId] = { choice, kind, category };

        const card = document.querySelector('[data-case="' + reviewId + '"]');
        const message =
          kind === "category"
            ? "Correction recorded · " + category
            : kind === "reprocess"
              ? "Queued for re-extraction with parser v4"
              : "Decision recorded · " + choice;

        if (!card || reduced.matches) {
          update();
          toast(message, "confirmed");
          return;
        }
        card.classList.add("is-leaving");
        window.setTimeout(() => {
          update();
          toast(message, "confirmed");
        }, 180);
      }

      /* ---------------------------------------------------------------
         ROUTE — IMPORTS
         --------------------------------------------------------------- */
      ROUTES.imports = function () {

        if (!state.drawer) return;

      /* ---------------------------------------------------------------
         SETUP — frontend-native, five steps, no shell commands
         --------------------------------------------------------------- */
      const SETUP_STEPS = [
        { title: "Reporting basis", label: "Reporting basis" },
        { title: "Financial Accounts", label: "Financial Accounts" },
        { title: "Statement ingestion", label: "Statement ingestion" },
        { title: "Capture on iPhone", label: "Capture on iPhone" },
        { title: "First Extraction", label: "First Extraction" },
      ];

      function setupDefaults() {
        return {
          currency: "SGD",
          zone: "Asia/Singapore",
          accounts: { multiplier: true, livefresh: true, paylah: false },
          path: "/volume1/billzebub/inbox",
          probe: "idle",
          token: false,
          extract: "idle",
        };
      }

      function openSetup(step) {
        state.setup.open = true;
        state.setup.step = typeof step === "number" ? step : 0;
        if (!state.setup.data.currency) state.setup.data = setupDefaults();
        const setup = document.getElementById("setup");
        renderSetup();
        reveal(setup);
      }

      function closeSetup() {
        if (!state.setup.open) return;
        state.setup.open = false;
        const setup = document.getElementById("setup");
        setup.classList.remove("is-open");
        window.setTimeout(
          () => {
            if (!state.setup.open) setup.hidden = true;
          },
          reduced.matches ? 10 : 220,
        );
        render();
      }

      function setupNext() {
        if (!canContinue()) return;
        if (state.setup.step === SETUP_STEPS.length - 1) {
          state.setup.done = true;
          closeSetup();
          toast("Setup complete · watching the ingestion folder", "confirmed");
          return;
        }
        state.setup.step += 1;
        renderSetup();
      }

      function setupBack() {
        if (state.setup.step === 0) {
          closeSetup();
          return;
        }
        state.setup.step -= 1;
        renderSetup();
      }

      function canContinue() {
        const data = state.setup.data;
        if (state.setup.step === 1)
          return Object.values(data.accounts).some(Boolean);
        if (state.setup.step === 2) return data.probe === "ok";
        if (state.setup.step === 3) return data.token;
        if (state.setup.step === 4) return data.extract === "done";
        return true;
      }

      function runProbe() {
        state.setup.data.probe = "running";
        renderSetup();
        window.setTimeout(
          () => {
            state.setup.data.probe = "ok";
            renderSetup();
          },
          reduced.matches ? 120 : 900,
        );
      }

      function runExtraction() {
        state.setup.data.extract = "running";
        renderSetup();
        window.setTimeout(
          () => {
            state.setup.data.extract = "done";
            renderSetup();
          },
          reduced.matches ? 160 : 1500,
        );
      }

            '<div style="display:flex;gap:var(--bz-s2)">' +
            '<button class="btn" data-act="probe" type="button">' +
            (probe === "ok" ? "Read again" : "Test read") +
            "</button>" +
            (probe === "ok"
              ? '<span class="badge badge--confirmed" style="align-self:center">Readable</span>'
              : "") +
            "</div>" +
            result +
            "</div>"
          );
        }

        if (step === 3) {
          return (
            '<span class="bz-eyebrow">Step four of five</span>' +
            '<h2 class="stage__title">Capture spending the moment it happens</h2>' +
            '<p class="stage__sub">An Apple Shortcut posts Real-time Claims from payment notifications. They show as provisional until a Statement Claim confirms them.</p>' +
            '<div class="stage__form">' +
            '<div class="field"><label>Capture token</label>' +
            (data.token
              ? '<div class="tokenline"><span>bz_pat_live_8Qk3R2vTn9YwLpAs</span>' +
                '<button class="btn btn--sm" data-act="copyToken" type="button">Copy</button></div>' +
                '<span class="field__hint">Scope: <b>claims:write</b> only. Rotate or revoke it in Settings at any time.</span>'
              : '<button class="btn btn--primary" data-act="setupToggle" data-arg="token" type="button">Create a capture token</button>' +
                '<span class="field__hint">Scoped to writing Claims. Nothing else.</span>') +
            "</div>" +
            '<div class="probe"><div class="probe__line"><b>1.</b> Install the Billzebub shortcut on your iPhone.</div>' +
            '<div class="probe__line"><b>2.</b> Paste the token when it asks.</div>' +
            '<div class="probe__line"><b>3.</b> Add an automation: when Apple Pay notifies, run the shortcut.</div></div>' +
            '<button class="btn btn--ghost btn--sm" data-act="setupSkip" type="button">Skip for now — statements alone are enough</button>' +
            "</div>"
          );
        }

        const extract = data.extract;
        const stageBody =
          extract === "idle"
            ? '<button class="btn btn--primary btn--lg" data-act="extract" type="button">Run the first Extraction</button>' +
              '<p class="field__hint">Nothing is written until every statement validates.</p>'
            : extract === "running"
              ? '<div class="probe">' +
                '<div class="probe__line"><span class="spinner"></span>Staging Claims from 4 Source Artifacts…</div>' +
                '<div class="probe__line">Validating statement totals</div>' +
                '<div class="probe__line">Reconciling Real-time Claims</div></div>'
              : '<div class="probe">' +
                '<div class="probe__line"><span style="color:var(--bz-confirmed)">' +
                icon("check") +
                "</span><b>54 Claims accepted from 3 statements</b></div>" +
                '<div class="probe__line"><b>24 Transactions</b> established, 2 still provisional</div>' +
                '<div class="probe__line"><b>8 Pending Review</b> · 4 categorization and Kind, 2 unmatched Claims, 1 reconciliation, 1 failed Extraction</div>' +
                '<div class="probe__line"><span style="color:var(--bz-failed)">' +
                icon("close") +
                "</span>1 Extraction rejected · dbs-live-fresh-2026-08.pdf quarantined</div></div>" +
                '<button class="btn btn--primary btn--lg" data-act="openInboxFromSetup" type="button">Open the review inbox</button>';

        return (
          '<span class="bz-eyebrow">Step five of five</span>' +
          '<h2 class="stage__title">Build your history</h2>' +
          '<p class="stage__sub">The first Extraction reads everything in the folder. A statement that fails validation creates no Claims and is quarantined, so a bad parse can never corrupt your history.</p>' +
          '<div class="stage__form">' +
          stageBody +
          "</div>"
        );
      }

      function renderSetup() {
        const step = state.setup.step;
        const steps = SETUP_STEPS.map((entry, index) => {
          const classes =
            "step" +
            (index === step ? " is-current" : index < step ? " is-done" : "");
          return (
            '<button class="' +
            classes +
            '" data-act="setupGoto" data-arg="' +
            index +
            '" type="button">' +
            '<span class="step__num">' +
            (index < step ? "✓" : index + 1) +
            "</span><span>" +
            entry.label +
            "</span></button>"
          );
        }).join("");

        const last = step === SETUP_STEPS.length - 1;
        document.getElementById("setup").innerHTML =
          '<aside class="setup__aside">' +
          '<div class="setup__brand"><div class="spine__mark" style="margin:0">B</div>' +
          "<div><b>Billzebub</b><br />" +
          '<span class="bz-muted" style="font-size:var(--bz-size-xs)">First run · local only</span></div></div>' +
          '<div class="steps">' +
          steps +
          "</div>" +
          '<div class="spine__spacer" style="flex:1"></div>' +
          '<p class="bz-muted" style="font-size:var(--bz-size-xs)">No shell access needed. Everything here is stored in your local workspace and can be changed later in Settings.</p>' +
          "</aside>" +
          '<div class="setup__main">' +
          '<div class="setup__stage stagefade">' +
          '<div class="setup__meter"><span data-fill="' +
          ((step + 1) / SETUP_STEPS.length).toFixed(2) +
          '"></span></div>' +
          setupStage() +
          "</div>" +
          '<div class="setup__foot">' +
          '<button class="btn" data-act="setupBack" type="button">' +
          (step === 0 ? "Cancel" : "Back") +
          "</button>" +
          '<span class="ledge__spacer"></span>' +
          '<span class="bz-muted" style="font-size:var(--bz-size-xs)">Step ' +
          (step + 1) +
          " of " +
          SETUP_STEPS.length +
          "</span>" +
          '<button class="btn btn--primary btn--lg" data-act="setupNext" type="button"' +
          (canContinue() ? "" : " disabled") +
          ">" +
          (last ? "Finish setup" : "Continue") +
          '<span class="kbd">↵</span></button>' +
          "</div></div>";

        requestAnimationFrame(() => paintMeters(true));
      }

      if (!applyHash()) render();

      window.setTimeout(() => {
        if (!state.setup.done && !state.setup.open) {
          toast("3 setup steps left before statements import automatically");
        }
      }, 900);
    </script>
  </body>
</html>
