<!doctype html>
<html lang="en-SG">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Billzebub — Ledger Desk prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ===================================================================
         BILLZEBUB — "LEDGER DESK"
         Throwaway arena prototype. Structure mirrors a future design system:

           1. TOKENS          -> @theme / tokens.css
           2. RESET + BASE    -> base.css
           3. PRIMITIVES      -> <Button> <Pill> <Field> <Badge> <Card>
           4. LAYOUT          -> <AppShell> <Spine> <Topbar> <Ledge>
           5. PATTERNS        -> <Ledger> <StatementBlock> <ReviewCase>
           6. OVERLAYS        -> <Drawer> <CommandPalette> <Setup> <Toast>
           7. MOTION          -> motion tokens + keyframes + reduced motion

         Every visual value below is a token reference. No literal hex, no
         literal duration, and no literal easing appears outside section 1.
         =================================================================== */

      /* ---------------------------------------------------------------
         1. TOKENS
         --------------------------------------------------------------- */
      :root {
        /* -- Flexoki Dark: surfaces ------------------------------------ */
        --bz-bg: #100f0f; /* black          page */
        --bz-surface: #1c1b1a; /* base-950  raised */
        --bz-surface-hover: #21201f; /* between 950/900 */
        --bz-line: #282726; /* base-900       hairline */
        --bz-line-strong: #343331; /* base-850  hover / control */
        --bz-control: #282726; /* base-900       quiet control fill */
        --bz-control-hover: #343331; /* base-850  */

        /* -- Flexoki Dark: ink ---------------------------------------- */
        --bz-ink: #cecdc3; /* base-200       primary text */
        --bz-ink-dim: #b7b5ac; /* base-300   secondary emphasis */
        --bz-ink-muted: #878580; /* base-500 muted label */
        --bz-ink-faint: #6f6e69; /* base-600  disabled / gutter */

        /* -- Flexoki Dark: semantic accents (the only four) ----------- */
        --bz-accent: #3aa99f; /* cyan-400    interactive */
        --bz-confirmed: #879a39; /* green-400 confirmed / positive */
        --bz-provisional: #d0a215; /* yellow-400 provisional / attention */
        --bz-failed: #d14d41; /* red-400     failed / blocking */

        /* Tinted washes, derived so no new hue is introduced. */
        --bz-accent-wash: color-mix(in srgb, var(--bz-accent) 14%, var(--bz-surface));
        --bz-accent-edge: color-mix(in srgb, var(--bz-accent) 42%, var(--bz-line));
        --bz-provisional-wash: color-mix(in srgb, var(--bz-provisional) 8%, var(--bz-surface));
        --bz-failed-wash: color-mix(in srgb, var(--bz-failed) 10%, var(--bz-surface));
        --bz-confirmed-wash: color-mix(in srgb, var(--bz-confirmed) 12%, var(--bz-surface));
        --bz-scrim: color-mix(in srgb, var(--bz-bg) 72%, transparent);

        /* -- Type ------------------------------------------------------ */
        --bz-font-ui: "Inter", ui-sans-serif, system-ui, -apple-system,
          "Segoe UI", sans-serif;
        --bz-font-display: "Iowan Old Style", "Palatino Linotype", Palatino,
          "Book Antiqua", Georgia, ui-serif, serif;
        --bz-font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo,
          Consolas, monospace;

        --bz-size-micro: 0.6875rem; /* 11px  keyboard hints, eyebrows */
        --bz-size-xs: 0.75rem; /* 12px     meta, pills */
        --bz-size-sm: 0.8125rem; /* 13px   dense ledger meta */
        --bz-size-base: 0.875rem; /* 14px  body, rows */
        --bz-size-md: 0.9375rem; /* 15px   row primary */
        --bz-size-lg: 1.125rem; /* 18px    section lead */
        --bz-size-xl: 1.375rem; /* 22px    statement figure */
        --bz-size-display: 2rem; /* 32px   editorial heading */
        --bz-size-hero: 2.75rem; /* 44px   the one big number */

        --bz-track-eyebrow: 0.09em;
        --bz-leading-tight: 1.15;
        --bz-leading-body: 1.55;

        /* -- Space (4px base) ------------------------------------------ */
        --bz-s1: 0.25rem;
        --bz-s2: 0.5rem;
        --bz-s3: 0.75rem;
        --bz-s4: 1rem;
        --bz-s5: 1.5rem;
        --bz-s6: 2rem;
        --bz-s7: 3rem;
        --bz-s8: 4rem;

        /* -- Radius ---------------------------------------------------- */
        --bz-r-sm: 0.375rem;
        --bz-r-md: 0.5rem;
        --bz-r-lg: 0.75rem;
        --bz-r-full: 999px;

        /* -- Structure ------------------------------------------------- */
        --bz-spine: 3.5rem; /* 56px glyph spine, not a labelled rail */
        --bz-topbar: 3.25rem;
        --bz-ledge: 1.75rem; /* keyboard status ledge */
        --bz-measure: 64rem; /* editorial column */
        --bz-drawer: 27rem;

        /* -- Motion (Emil Kowalski rules) ------------------------------ */
        --bz-ease-out: cubic-bezier(0.16, 1, 0.3, 1); /* entrances */
        --bz-ease-out-soft: cubic-bezier(0.22, 0.61, 0.36, 1); /* exits */
        --bz-d-press: 90ms;
        --bz-d-fast: 120ms;
        --bz-d-base: 180ms;
        --bz-d-slow: 240ms; /* hard ceiling for UI motion */
        --bz-press: 0.97; /* never scale(0) */
        --bz-lift: 6px; /* entrance travel */

        /* -- Elevation ------------------------------------------------- */
        --bz-shadow-overlay: 0 24px 64px -12px rgb(0 0 0 / 0.62);
        --bz-shadow-drawer: -28px 0 72px -24px rgb(0 0 0 / 0.7);
        --bz-focus: 0 0 0 2px var(--bz-bg), 0 0 0 3px var(--bz-accent);
      }

      /* ---------------------------------------------------------------
         2. RESET + BASE
         --------------------------------------------------------------- */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bz-bg);
        color: var(--bz-ink);
        font-family: var(--bz-font-ui);
        font-size: var(--bz-size-base);
        line-height: var(--bz-leading-body);
        font-synthesis: none;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      h1,
      h2,
      h3,
      h4,
      p,
      figure {
        margin: 0;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }

      button {
        cursor: pointer;
      }

      :focus-visible {
        outline: none;
        box-shadow: var(--bz-focus);
      }

      .bz-num {
        font-variant-numeric: tabular-nums;
        font-feature-settings: "tnum" 1;
      }

      .bz-eyebrow {
        color: var(--bz-ink-muted);
        font-size: var(--bz-size-micro);
        font-weight: 600;
        letter-spacing: var(--bz-track-eyebrow);
        text-transform: uppercase;
      }

      .bz-muted {
        color: var(--bz-ink-muted);
      }

      .bz-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      /* ---------------------------------------------------------------
         3. PRIMITIVES — shadcn-flavoured: quiet borders, clear press
         --------------------------------------------------------------- */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--bz-s2);
        min-height: 2rem;
        padding: 0 var(--bz-s3);
        border: 1px solid var(--bz-line-strong);
        border-radius: var(--bz-r-sm);
        background: var(--bz-control);
        color: var(--bz-ink);
        font-size: var(--bz-size-sm);
        font-weight: 500;
        white-space: nowrap;
        transition:
          background var(--bz-d-fast) var(--bz-ease-out),
          border-color var(--bz-d-fast) var(--bz-ease-out),
          color var(--bz-d-fast) var(--bz-ease-out),
          transform var(--bz-d-press) var(--bz-ease-out);
      }

      .btn:hover {
        background: var(--bz-control-hover);
        border-color: var(--bz-ink-faint);
      }

      .btn:active {
        transform: scale(var(--bz-press));
      }

      .btn[disabled] {
        opacity: 0.45;
        cursor: not-allowed;
        transform: none;
      }

      .btn--primary {
        border-color: var(--bz-accent);
        background: var(--bz-accent);
        color: var(--bz-bg);
        font-weight: 600;
      }

      .btn--primary:hover {
        background: color-mix(in srgb, var(--bz-accent) 86%, var(--bz-ink));
        border-color: color-mix(in srgb, var(--bz-accent) 86%, var(--bz-ink));
      }

      .btn--ghost {
        border-color: transparent;
        background: transparent;
        color: var(--bz-ink-muted);
      }

      .btn--ghost:hover {
        background: var(--bz-control);
        color: var(--bz-ink);
        border-color: var(--bz-line);
      }

      .btn--danger:hover {
        border-color: var(--bz-failed);
        color: var(--bz-failed);
      }

      .btn--lg {
        min-height: 2.375rem;
        padding: 0 var(--bz-s4);
        font-size: var(--bz-size-base);
      }

      .btn--sm {
        min-height: 1.75rem;
        padding: 0 var(--bz-s2);
        font-size: var(--bz-size-xs);
      }

      .kbd {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 1.125rem;
        height: 1.125rem;
        padding: 0 var(--bz-s1);
        border: 1px solid var(--bz-line-strong);
        border-radius: var(--bz-r-sm);
        background: var(--bz-bg);
        color: var(--bz-ink-muted);
        font-family: var(--bz-font-ui);
        font-size: var(--bz-size-micro);
        font-weight: 600;
        line-height: 1;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: var(--bz-s2);
        height: 1.75rem;
        padding: 0 var(--bz-s3);
        border: 1px solid var(--bz-line);
        border-radius: var(--bz-r-full);
        background: transparent;
        color: var(--bz-ink-muted);
        font-size: var(--bz-size-xs);
        font-weight: 500;
        transition:
          background var(--bz-d-fast) var(--bz-ease-out),
          border-color var(--bz-d-fast) var(--bz-ease-out),
          color var(--bz-d-fast) var(--bz-ease-out),
          transform var(--bz-d-press) var(--bz-ease-out);
      }

      .pill:hover {
        background: var(--bz-control);
        color: var(--bz-ink);
      }

      .pill:active {
        transform: scale(var(--bz-press));
      }

      .pill[aria-pressed="true"],
      .pill.is-on {
        border-color: var(--bz-accent-edge);
        background: var(--bz-accent-wash);
        color: var(--bz-ink);
      }

      .pill__count {
        color: var(--bz-ink-faint);
        font-variant-numeric: tabular-nums;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: var(--bz-s1);
        padding: 0 var(--bz-s2);
        height: 1.25rem;
        border: 1px solid var(--bz-line);
        border-radius: var(--bz-r-sm);
        color: var(--bz-ink-muted);
        font-size: var(--bz-size-micro);
        font-weight: 600;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }

      .badge::before {
        content: "";
        width: 5px;
        height: 5px;
        border-radius: var(--bz-r-full);
        background: currentColor;
      }

      .badge--confirmed {
        color: var(--bz-confirmed);
        border-color: color-mix(in srgb, var(--bz-confirmed) 34%, var(--bz-line));
      }

      .badge--provisional {
        color: var(--bz-provisional);
        border-color: color-mix(in srgb, var(--bz-provisional) 34%, var(--bz-line));
      }

      .badge--failed {
        color: var(--bz-failed);
        border-color: color-mix(in srgb, var(--bz-failed) 34%, var(--bz-line));
      }

      .badge--quiet::before {
        display: none;
      }

      .field {
        display: grid;
        gap: var(--bz-s2);
      }

      .field > label {
        color: var(--bz-ink-dim);
        font-size: var(--bz-size-sm);
        font-weight: 500;
      }

      .field__hint {
        color: var(--bz-ink-muted);
        font-size: var(--bz-size-xs);
      }

      .input,
      .select {
        width: 100%;
        min-height: 2.25rem;
        padding: 0 var(--bz-s3);
        border: 1px solid var(--bz-line-strong);
        border-radius: var(--bz-r-sm);
        background: var(--bz-bg);
        font-size: var(--bz-size-base);
        transition:
          border-color var(--bz-d-fast) var(--bz-ease-out),
          background var(--bz-d-fast) var(--bz-ease-out);
      }

      .input:hover,
      .select:hover {
        border-color: var(--bz-ink-faint);
      }

      .input:focus,
      .select:focus {
        outline: none;
        border-color: var(--bz-accent);
        box-shadow: 0 0 0 3px var(--bz-accent-wash);
      }

      .input--mono {
        font-family: var(--bz-font-mono);
        font-size: var(--bz-size-sm);
      }

      .card {
        border: 1px solid var(--bz-line);
        border-radius: var(--bz-r-lg);
        background: var(--bz-surface);
      }

      .rule {
        height: 1px;
        border: 0;
        margin: 0;
        background: var(--bz-line);
      }

      /* ---------------------------------------------------------------
         4. LAYOUT — AppShell / Spine / Topbar / Ledge
         --------------------------------------------------------------- */
      .shell {
        display: grid;
        grid-template-columns: var(--bz-spine) minmax(0, 1fr);
        min-height: 100vh;
      }

      .spine {
        position: sticky;
        top: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--bz-s2);
        height: 100vh;
        padding: var(--bz-s3) 0 calc(var(--bz-ledge) + var(--bz-s3));
        border-right: 1px solid var(--bz-line);
        background: var(--bz-bg);
      }

      .spine__mark {
        display: grid;
        place-items: center;
        width: 1.75rem;
        height: 1.75rem;
        margin-bottom: var(--bz-s3);
        border-radius: var(--bz-r-sm);
        background: var(--bz-accent-wash);
        border: 1px solid var(--bz-accent-edge);
        color: var(--bz-accent);
        font-family: var(--bz-font-display);
        font-size: var(--bz-size-sm);
        font-weight: 700;
      }

      .spine__btn {
        position: relative;
        display: grid;
        place-items: center;
        width: 2.25rem;
        height: 2.25rem;
        border: 1px solid transparent;
        border-radius: var(--bz-r-md);
        background: transparent;
        color: var(--bz-ink-faint);
        transition:
          color var(--bz-d-fast) var(--bz-ease-out),
          background var(--bz-d-fast) var(--bz-ease-out),
          transform var(--bz-d-press) var(--bz-ease-out);
      }

      .spine__btn:hover {
        background: var(--bz-surface);
        color: var(--bz-ink);
      }

      .spine__btn:active {
        transform: scale(var(--bz-press));
      }

      .spine__btn[aria-current="page"] {
        background: var(--bz-surface);
        border-color: var(--bz-line);
        color: var(--bz-accent);
      }

      .spine__btn[aria-current="page"]::after {
        content: "";
        position: absolute;
        left: calc(var(--bz-s2) * -1 - 3px);
        width: 2px;
        height: 1rem;
        border-radius: var(--bz-r-full);
        background: var(--bz-accent);
      }

      .spine__dot {
        position: absolute;
        top: 5px;
        right: 5px;
        width: 5px;
        height: 5px;
        border-radius: var(--bz-r-full);
        background: var(--bz-provisional);
      }

      .spine__tip {
        position: absolute;
        left: calc(100% + var(--bz-s2));
        display: flex;
        align-items: center;
        gap: var(--bz-s2);
        padding: var(--bz-s1) var(--bz-s2);
        border: 1px solid var(--bz-line);
        border-radius: var(--bz-r-sm);
        background: var(--bz-surface);
        color: var(--bz-ink);
        font-size: var(--bz-size-xs);
        white-space: nowrap;
        opacity: 0;
        transform: translateX(-4px);
        pointer-events: none;
        z-index: 40;
        transition:
          opacity var(--bz-d-fast) var(--bz-ease-out),
          transform var(--bz-d-fast) var(--bz-ease-out);
      }

      .spine__btn:hover .spine__tip,
      .spine__btn:focus-visible .spine__tip {
        opacity: 1;
        transform: translateX(0);
      }

      .spine__spacer {
        flex: 1;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 30;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 22rem) minmax(0, 1fr);
        align-items: center;
        gap: var(--bz-s4);
        height: var(--bz-topbar);
        padding: 0 var(--bz-s5);
        border-bottom: 1px solid var(--bz-line);
        background: color-mix(in srgb, var(--bz-bg) 88%, transparent);
        backdrop-filter: blur(12px);
      }

      .topbar__where {
        display: flex;
        align-items: center;
        gap: var(--bz-s2);
        min-width: 0;
        font-size: var(--bz-size-sm);
      }

      .topbar__where b {
        font-weight: 600;
      }

      .topbar__sep {
        color: var(--bz-ink-faint);
      }

      .cmdtrigger {
        display: flex;
        align-items: center;
        gap: var(--bz-s2);
        width: 100%;
        height: 2rem;
        padding: 0 var(--bz-s2) 0 var(--bz-s3);
        border: 1px solid var(--bz-line);
        border-radius: var(--bz-r-sm);
        background: var(--bz-surface);
        color: var(--bz-ink-muted);
        font-size: var(--bz-size-sm);
        transition:
          border-color var(--bz-d-fast) var(--bz-ease-out),
          background var(--bz-d-fast) var(--bz-ease-out),
          transform var(--bz-d-press) var(--bz-ease-out);
      }

      .cmdtrigger:hover {
        border-color: var(--bz-line-strong);
        background: var(--bz-surface-hover);
        color: var(--bz-ink);
      }

      .cmdtrigger:active {
        transform: scale(var(--bz-press));
      }

      .cmdtrigger__spacer {
        flex: 1;
      }

      .topbar__right {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: var(--bz-s2);
      }

      .sync {
        display: inline-flex;
        align-items: center;
        gap: var(--bz-s2);
        color: var(--bz-ink-muted);
        font-size: var(--bz-size-xs);
      }

      .sync__dot {
        width: 6px;
        height: 6px;
        border-radius: var(--bz-r-full);
        background: var(--bz-confirmed);
      }

      .canvas {
        padding: var(--bz-s6) var(--bz-s5) calc(var(--bz-ledge) + var(--bz-s8));
      }

      .measure {
        width: min(var(--bz-measure), 100%);
        margin: 0 auto;
      }

      .ledge {
        position: fixed;
        left: var(--bz-spine);
        right: 0;
        bottom: 0;
        z-index: 25;
        display: flex;
        align-items: center;
        gap: var(--bz-s4);
        height: var(--bz-ledge);
        padding: 0 var(--bz-s5);
        border-top: 1px solid var(--bz-line);
        background: color-mix(in srgb, var(--bz-bg) 92%, transparent);
        backdrop-filter: blur(8px);
        color: var(--bz-ink-faint);
        font-size: var(--bz-size-micro);
      }

      .ledge__hint {
        display: inline-flex;
        align-items: center;
        gap: var(--bz-s1);
        white-space: nowrap;
      }

      .ledge__spacer {
        flex: 1;
      }

      /* ---------------------------------------------------------------
         5. PATTERNS
         --------------------------------------------------------------- */

      /* 5a. StatementBlock — editorial overview typography */
      .dateline {
        display: flex;
        align-items: baseline;
        gap: var(--bz-s3);
        margin-bottom: var(--bz-s5);
      }

      .statement__lead {
        max-width: 34rem;
        font-family: var(--bz-font-display);
        font-size: var(--bz-size-display);
        line-height: var(--bz-leading-tight);
        letter-spacing: -0.01em;
        color: var(--bz-ink);
      }

      .statement__lead em {
        font-style: normal;
        color: var(--bz-ink-muted);
      }

      .figure {
        display: flex;
        align-items: baseline;
        gap: var(--bz-s3);
        margin: var(--bz-s5) 0 var(--bz-s3);
      }

      .figure__currency {
        color: var(--bz-ink-muted);
        font-size: var(--bz-size-lg);
        font-weight: 500;
      }

      .figure__value {
        font-size: var(--bz-size-hero);
        font-weight: 600;
        letter-spacing: -0.03em;
        line-height: 1;
      }

      .splitline {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: var(--bz-s4);
        padding: var(--bz-s3) 0;
        border-top: 1px solid var(--bz-line);
        font-size: var(--bz-size-base);
      }

      .splitline:last-of-type {
        border-bottom: 1px solid var(--bz-line);
      }

      .splitline__label {
        display: inline-flex;
        align-items: center;
        gap: var(--bz-s2);
        color: var(--bz-ink-dim);
      }

      .splitline__amount {
        font-weight: 500;
        letter-spacing: -0.01em;
      }

      .linkish {
        border: 0;
        background: none;
        padding: 0;
        color: var(--bz-accent);
        font-size: var(--bz-size-sm);
        font-weight: 500;
        text-align: left;
        transition:
          color var(--bz-d-fast) var(--bz-ease-out),
          transform var(--bz-d-press) var(--bz-ease-out);
      }

      .linkish:hover {
        color: color-mix(in srgb, var(--bz-accent) 80%, var(--bz-ink));
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .linkish:active {
        transform: scale(var(--bz-press));
      }

      .section {
        margin-top: var(--bz-s7);
      }

      .section__head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: var(--bz-s4);
        padding-bottom: var(--bz-s3);
        border-bottom: 1px solid var(--bz-line-strong);
      }

      .section__title {
        font-family: var(--bz-font-display);
        font-size: var(--bz-size-lg);
        font-weight: 600;
        letter-spacing: -0.005em;
      }

      .grid2 {
        display: grid;
        grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
        gap: var(--bz-s6);
      }

      /* 5b. Category bars — one accent at varying weight, never a rainbow */
      .catrow {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: baseline;
        gap: var(--bz-s3);
        width: 100%;
        padding: var(--bz-s3) 0;
        border: 0;
        border-bottom: 1px solid var(--bz-line);
        background: none;
        text-align: left;
        transition: background var(--bz-d-fast) var(--bz-ease-out);
      }

      .catrow:hover {
        background: var(--bz-surface);
      }

      .catrow__name {
        font-size: var(--bz-size-base);
      }

      .catrow__amount {
        font-size: var(--bz-size-base);
        font-weight: 500;
      }

      .catrow__bar {
        grid-column: 1 / -1;
        height: 3px;
        border-radius: var(--bz-r-full);
        background: var(--bz-line-strong);
        overflow: hidden;
      }

      /* Category colour stays subordinate to the amount: one dimmed accent,
         never a categorical palette. */
      .catrow__fill {
        display: block;
        height: 100%;
        border-radius: var(--bz-r-full);
        background: color-mix(in srgb, var(--bz-accent) 62%, var(--bz-line));
        transform-origin: left center;
        transform: scaleX(var(--fill, 0));
        transition: transform var(--bz-d-slow) var(--bz-ease-out);
      }

      /* 5c. Trend — hand-rolled SVG, no chart library */
      .trend {
        display: grid;
        grid-template-columns: repeat(13, 1fr);
        align-items: end;
        gap: 3px;
        height: 4.5rem;
        margin-top: var(--bz-s4);
      }

      .trend__bar {
        border: 0;
        padding: 0;
        border-radius: 2px 2px 0 0;
        background: var(--bz-line-strong);
        transform-origin: bottom center;
        transform: scaleY(var(--h, 0.1));
        height: 100%;
        transition:
          transform var(--bz-d-slow) var(--bz-ease-out),
          background var(--bz-d-fast) var(--bz-ease-out);
      }

      .trend__bar:hover {
        background: var(--bz-ink-faint);
      }

      .trend__bar.is-today {
        background: var(--bz-accent);
      }

      .trend__bar.is-provisional {
        background: var(--bz-provisional);
      }

      .trend__axis {
        display: flex;
        justify-content: space-between;
        margin-top: var(--bz-s2);
        color: var(--bz-ink-faint);
        font-size: var(--bz-size-micro);
      }

      /* 5d. Ledger — the dense core pattern */
      .ledger {
        border-top: 1px solid var(--bz-line-strong);
      }

      .ledger__daymark {
        display: flex;
        align-items: center;
        gap: var(--bz-s3);
        padding: var(--bz-s4) 0 var(--bz-s2);
        color: var(--bz-ink-muted);
        font-size: var(--bz-size-xs);
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .ledger__daymark::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--bz-line);
      }

      .row {
        position: relative;
        display: grid;
        grid-template-columns:
          3.25rem minmax(0, 1fr) 8rem 8.5rem 5.75rem
          6.25rem;
        align-items: center;
        gap: var(--bz-s3);
        width: 100%;
        padding: var(--bz-s3);
        border: 0;
        border-bottom: 1px solid var(--bz-line);
        border-radius: var(--bz-r-sm);
        background: none;
        color: inherit;
        text-align: left;
        font-size: var(--bz-size-md);
        transition:
          background var(--bz-d-fast) var(--bz-ease-out),
          box-shadow var(--bz-d-fast) var(--bz-ease-out),
          opacity var(--bz-d-base) var(--bz-ease-out),
          transform var(--bz-d-base) var(--bz-ease-out);
      }

      .row:hover {
        background: var(--bz-surface);
      }

      .row.is-cursor {
        background: var(--bz-surface);
        box-shadow: inset 2px 0 0 0 var(--bz-accent);
      }

      .row.is-leaving {
        opacity: 0;
        transform: translateX(10px);
      }

      .row__date {
        color: var(--bz-ink-muted);
        font-size: var(--bz-size-sm);
      }

      .row__who {
        min-width: 0;
      }

      .row__name {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 500;
      }

      .row__raw {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--bz-ink-faint);
        font-family: var(--bz-font-mono);
        font-size: var(--bz-size-micro);
        letter-spacing: -0.01em;
      }

      .row__meta {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--bz-ink-muted);
        font-size: var(--bz-size-sm);
      }

      .row__cat {
        min-width: 0;
        overflow: hidden;
      }

      .row__state {
        display: flex;
        justify-content: flex-start;
      }

      .row__amount {
        text-align: right;
        font-weight: 500;
        letter-spacing: -0.01em;
      }

      .row__amount.is-positive {
        color: var(--bz-confirmed);
      }

      .row__amount.is-provisional {
        color: var(--bz-ink-dim);
      }

      .tag {
        display: inline-flex;
        align-items: center;
        gap: var(--bz-s1);
        max-width: 100%;
        padding: 1px var(--bz-s2);
        border: 1px solid var(--bz-line);
        border-radius: var(--bz-r-sm);
        color: var(--bz-ink-muted);
        font-size: var(--bz-size-micro);
        font-weight: 500;
      }

      .tag--empty {
        border-style: dashed;
        border-color: var(--bz-provisional);
        color: var(--bz-provisional);
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: var(--bz-s2);
        flex-wrap: wrap;
        margin: var(--bz-s4) 0 var(--bz-s5);
      }

      .toolbar__search {
        position: relative;
        flex: 1;
        min-width: 12rem;
      }

      .empty {
        padding: var(--bz-s7) var(--bz-s4);
        border: 1px dashed var(--bz-line-strong);
        border-radius: var(--bz-r-lg);
        color: var(--bz-ink-muted);
        text-align: center;
      }

      /* 5e. ReviewCase — one decision at a time */
      .queuebar {
        display: flex;
        gap: var(--bz-s2);
        flex-wrap: wrap;
        margin: var(--bz-s4) 0 var(--bz-s5);
      }

      .case {
        border: 1px solid var(--bz-line);
        border-radius: var(--bz-r-lg);
        background: var(--bz-surface);
        overflow: hidden;
      }

      .case + .case {
        margin-top: var(--bz-s4);
      }

      .case.is-cursor {
        border-color: var(--bz-accent-edge);
      }

      .case.is-leaving {
        opacity: 0;
        transform: translateY(-4px);
        transition:
          opacity var(--bz-d-base) var(--bz-ease-out),
          transform var(--bz-d-base) var(--bz-ease-out);
      }

      .case__head {
        display: flex;
        align-items: center;
        gap: var(--bz-s3);
        padding: var(--bz-s3) var(--bz-s4);
        border-bottom: 1px solid var(--bz-line);
      }

      .case__head--attention {
        background: var(--bz-provisional-wash);
      }

      .case__head--blocking {
        background: var(--bz-failed-wash);
      }

      .case__title {
        font-size: var(--bz-size-base);
        font-weight: 600;
      }

      .case__body {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 15rem);
        gap: var(--bz-s5);
        padding: var(--bz-s4);
      }

      .case__why {
        color: var(--bz-ink-muted);
        font-size: var(--bz-size-sm);
      }

      .case__subject {
        display: flex;
        align-items: baseline;
        gap: var(--bz-s3);
        margin-bottom: var(--bz-s3);
      }

      .case__subject b {
        font-size: var(--bz-size-lg);
        font-weight: 600;
      }

      .case__amount {
        font-size: var(--bz-size-xl);
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .case__evidence {
        display: grid;
        gap: var(--bz-s2);
        padding: var(--bz-s3);
        border: 1px solid var(--bz-line);
        border-radius: var(--bz-r-md);
        background: var(--bz-bg);
        font-size: var(--bz-size-sm);
      }

      .case__decide {
        display: grid;
        align-content: start;
        gap: var(--bz-s2);
        padding-left: var(--bz-s5);
        border-left: 1px solid var(--bz-line);
      }

      .choice {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--bz-s2);
        width: 100%;
        min-height: 2.125rem;
        padding: 0 var(--bz-s3);
        border: 1px solid var(--bz-line-strong);
        border-radius: var(--bz-r-sm);
        background: var(--bz-control);
        font-size: var(--bz-size-sm);
        text-align: left;
        transition:
          background var(--bz-d-fast) var(--bz-ease-out),
          border-color var(--bz-d-fast) var(--bz-ease-out),
          transform var(--bz-d-press) var(--bz-ease-out);
      }

      .choice:hover {
        background: var(--bz-control-hover);
        border-color: var(--bz-accent-edge);
      }

      .choice:active {
        transform: scale(var(--bz-press));
      }

      .kv {
        display: grid;
        grid-template-columns: 8.5rem minmax(0, 1fr);
        gap: var(--bz-s2) var(--bz-s3);
        font-size: var(--bz-size-sm);
      }

      .kv dt {
        color: var(--bz-ink-muted);
      }

      .kv dd {
        margin: 0;
      }

      /* ---------------------------------------------------------------
         6. OVERLAYS
         --------------------------------------------------------------- */
      .scrim {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: var(--bz-scrim);
        opacity: 0;
        transition: opacity var(--bz-d-base) var(--bz-ease-out);
      }

      .scrim.is-open {
        opacity: 1;
      }

      .scrim[hidden] {
        display: none;
      }

      /* Drawer */
      .drawer {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        z-index: 60;
        width: min(var(--bz-drawer), 100%);
        display: flex;
        flex-direction: column;
        border-left: 1px solid var(--bz-line);
        background: var(--bz-surface);
        box-shadow: var(--bz-shadow-drawer);
        opacity: 0;
        transform: translateX(18px);
        transition:
          opacity var(--bz-d-base) var(--bz-ease-out),
          transform var(--bz-d-slow) var(--bz-ease-out);
      }

      .drawer.is-open {
        opacity: 1;
        transform: translateX(0);
      }

      .drawer[hidden] {
        display: none;
      }

      .drawer__head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: var(--bz-s3);
        padding: var(--bz-s4);
        border-bottom: 1px solid var(--bz-line);
      }

      .drawer__body {
        flex: 1;
        overflow-y: auto;
        padding: var(--bz-s4);
      }

      .drawer__foot {
        display: flex;
        gap: var(--bz-s2);
        padding: var(--bz-s3) var(--bz-s4);
        border-top: 1px solid var(--bz-line);
        background: var(--bz-bg);
      }

      .block {
        margin-top: var(--bz-s5);
      }

      .block__title {
        margin-bottom: var(--bz-s3);
        padding-bottom: var(--bz-s2);
        border-bottom: 1px solid var(--bz-line);
        color: var(--bz-ink-muted);
        font-size: var(--bz-size-micro);
        font-weight: 600;
        letter-spacing: var(--bz-track-eyebrow);
        text-transform: uppercase;
      }

      .claim {
        display: grid;
        gap: var(--bz-s1);
        padding: var(--bz-s3);
        border: 1px solid var(--bz-line);
        border-radius: var(--bz-r-md);
        background: var(--bz-bg);
        font-size: var(--bz-size-sm);
      }

      .claim + .claim {
        margin-top: var(--bz-s2);
      }

      .claim__top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--bz-s2);
      }

      .claim__raw {
        color: var(--bz-ink-faint);
        font-family: var(--bz-font-mono);
        font-size: var(--bz-size-micro);
        word-break: break-all;
      }

      .timeline {
        display: grid;
        gap: var(--bz-s3);
        font-size: var(--bz-size-sm);
      }

      .timeline__item {
        display: grid;
        grid-template-columns: 0.75rem minmax(0, 1fr);
        gap: var(--bz-s3);
      }

      .timeline__dot {
        margin-top: 0.4rem;
        width: 7px;
        height: 7px;
        border-radius: var(--bz-r-full);
        background: var(--bz-line-strong);
      }

      .timeline__dot.is-now {
        background: var(--bz-accent);
      }

      /* Command palette */
      .palette {
        position: fixed;
        left: 50%;
        top: 14vh;
        z-index: 70;
        width: min(34rem, calc(100vw - 2rem));
        transform: translate(-50%, 0) scale(0.98);
        opacity: 0;
        border: 1px solid var(--bz-line-strong);
        border-radius: var(--bz-r-lg);
        background: var(--bz-surface);
        box-shadow: var(--bz-shadow-overlay);
        overflow: hidden;
        transition:
          opacity var(--bz-d-base) var(--bz-ease-out),
          transform var(--bz-d-base) var(--bz-ease-out);
      }

      .palette.is-open {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
      }

      .palette[hidden] {
        display: none;
      }

      .palette__input {
        width: 100%;
        height: 2.875rem;
        padding: 0 var(--bz-s4);
        border: 0;
        border-bottom: 1px solid var(--bz-line);
        background: transparent;
        font-size: var(--bz-size-md);
      }

      .palette__input:focus {
        outline: none;
      }

      .palette__list {
        max-height: 19rem;
        overflow-y: auto;
        padding: var(--bz-s2);
      }

      .palette__group {
        padding: var(--bz-s2) var(--bz-s2) var(--bz-s1);
        color: var(--bz-ink-faint);
        font-size: var(--bz-size-micro);
        font-weight: 600;
        letter-spacing: var(--bz-track-eyebrow);
        text-transform: uppercase;
      }

      .palette__item {
        display: flex;
        align-items: center;
        gap: var(--bz-s3);
        width: 100%;
        min-height: 2.125rem;
        padding: 0 var(--bz-s2);
        border: 0;
        border-radius: var(--bz-r-sm);
        background: none;
        color: var(--bz-ink-dim);
        font-size: var(--bz-size-base);
        text-align: left;
        transition: background var(--bz-d-fast) var(--bz-ease-out);
      }

      .palette__item[aria-selected="true"] {
        background: var(--bz-control);
        color: var(--bz-ink);
      }

      .palette__keys {
        display: flex;
        gap: 2px;
        margin-left: auto;
      }

      .palette__glyph {
        color: var(--bz-ink-faint);
      }

      .palette__empty {
        padding: var(--bz-s5) var(--bz-s3);
        color: var(--bz-ink-muted);
        font-size: var(--bz-size-sm);
        text-align: center;
      }

      /* Setup (frontend-native onboarding) */
      .setup {
        position: fixed;
        inset: 0;
        z-index: 80;
        display: grid;
        grid-template-columns: 17rem minmax(0, 1fr);
        background: var(--bz-bg);
        opacity: 0;
        transform: scale(0.995);
        transition:
          opacity var(--bz-d-slow) var(--bz-ease-out),
          transform var(--bz-d-slow) var(--bz-ease-out);
      }

      .setup.is-open {
        opacity: 1;
        transform: scale(1);
      }

      .setup[hidden] {
        display: none;
      }

      .setup__aside {
        display: flex;
        flex-direction: column;
        padding: var(--bz-s6) var(--bz-s5);
        border-right: 1px solid var(--bz-line);
        background: var(--bz-surface);
      }

      .setup__brand {
        display: flex;
        align-items: center;
        gap: var(--bz-s3);
        margin-bottom: var(--bz-s6);
      }

      .steps {
        display: grid;
        gap: var(--bz-s1);
      }

      .steps > button {
        border: 0;
        background: transparent;
        font: inherit;
        color: inherit;
        text-align: left;
        cursor: pointer;
      }

      .step {
        display: grid;
        grid-template-columns: 1.5rem minmax(0, 1fr);
        align-items: center;
        gap: var(--bz-s3);
        padding: var(--bz-s2);
        border-radius: var(--bz-r-md);
        color: var(--bz-ink-faint);
        font-size: var(--bz-size-sm);
        transition:
          color var(--bz-d-fast) var(--bz-ease-out),
          background var(--bz-d-fast) var(--bz-ease-out);
      }

      .step.is-current {
        background: var(--bz-bg);
        color: var(--bz-ink);
        font-weight: 500;
      }

      .step.is-done {
        color: var(--bz-ink-muted);
      }

      .step__num {
        display: grid;
        place-items: center;
        width: 1.5rem;
        height: 1.5rem;
        border: 1px solid var(--bz-line-strong);
        border-radius: var(--bz-r-full);
        font-family: var(--bz-font-display);
        font-size: var(--bz-size-xs);
        font-variant-numeric: tabular-nums;
      }

      .step.is-current .step__num {
        border-color: var(--bz-accent);
        color: var(--bz-accent);
      }

      .step.is-done .step__num {
        border-color: color-mix(in srgb, var(--bz-confirmed) 40%, var(--bz-line));
        color: var(--bz-confirmed);
      }

      .setup__main {
        display: flex;
        flex-direction: column;
        overflow-y: auto;
      }

      .setup__stage {
        flex: 1;
        width: min(38rem, 100%);
        margin: 0 auto;
        padding: var(--bz-s8) var(--bz-s5) var(--bz-s6);
      }

      .setup__foot {
        position: sticky;
        bottom: 0;
        display: flex;
        align-items: center;
        gap: var(--bz-s3);
        padding: var(--bz-s4) var(--bz-s5);
        border-top: 1px solid var(--bz-line);
        background: color-mix(in srgb, var(--bz-bg) 92%, transparent);
        backdrop-filter: blur(8px);
      }

      .setup__foot .ledge__spacer {
        flex: 1;
      }

      .setup__meter {
        height: 2px;
        border-radius: var(--bz-r-full);
        background: var(--bz-line);
        overflow: hidden;
        margin-bottom: var(--bz-s6);
      }

      .setup__meter span {
        display: block;
        height: 100%;
        background: var(--bz-accent);
        transform-origin: left center;
        transform: scaleX(var(--p, 0.2));
        transition: transform var(--bz-d-slow) var(--bz-ease-out);
      }

      .stage__title {
        margin: var(--bz-s3) 0 var(--bz-s3);
        font-family: var(--bz-font-display);
        font-size: var(--bz-size-display);
        line-height: var(--bz-leading-tight);
        letter-spacing: -0.015em;
      }

      .stage__sub {
        max-width: 32rem;
        color: var(--bz-ink-muted);
      }

      .stage__form {
        display: grid;
        gap: var(--bz-s4);
        margin-top: var(--bz-s6);
      }

      .pick {
        display: flex;
        align-items: center;
        gap: var(--bz-s3);
        width: 100%;
        padding: var(--bz-s3);
        border: 1px solid var(--bz-line-strong);
        border-radius: var(--bz-r-md);
        background: var(--bz-surface);
        text-align: left;
        transition:
          border-color var(--bz-d-fast) var(--bz-ease-out),
          background var(--bz-d-fast) var(--bz-ease-out),
          transform var(--bz-d-press) var(--bz-ease-out);
      }

      .pick:hover {
        border-color: var(--bz-ink-faint);
      }

      .pick:active {
        transform: scale(var(--bz-press));
      }

      .pick.is-on {
        border-color: var(--bz-accent);
        background: var(--bz-accent-wash);
      }

      .pick__tick {
        display: grid;
        place-items: center;
        width: 1.125rem;
        height: 1.125rem;
        border: 1px solid var(--bz-line-strong);
        border-radius: var(--bz-r-sm);
        color: var(--bz-bg);
        font-size: var(--bz-size-micro);
      }

      .pick.is-on .pick__tick {
        border-color: var(--bz-accent);
        background: var(--bz-accent);
      }

      .pick__body {
        flex: 1;
        min-width: 0;
      }

      .pick__name {
        display: block;
        font-size: var(--bz-size-base);
        font-weight: 500;
      }

      .pick__meta {
        display: block;
        color: var(--bz-ink-muted);
        font-size: var(--bz-size-xs);
      }

      .stagefade {
        animation: bz-rise var(--bz-d-slow) var(--bz-ease-out) both;
      }

      .probe {
        display: grid;
        gap: var(--bz-s2);
        padding: var(--bz-s3);
        border: 1px solid var(--bz-line);
        border-radius: var(--bz-r-md);
        background: var(--bz-surface);
        font-size: var(--bz-size-sm);
      }

      .probe__line {
        display: flex;
        align-items: center;
        gap: var(--bz-s2);
        color: var(--bz-ink-muted);
      }

      .probe__line b {
        color: var(--bz-ink);
        font-weight: 500;
      }

      .spinner {
        width: 12px;
        height: 12px;
        border: 2px solid var(--bz-line-strong);
        border-top-color: var(--bz-accent);
        border-radius: var(--bz-r-full);
        animation: bz-spin 640ms linear infinite;
      }

      .tokenline {
        display: flex;
        align-items: center;
        gap: var(--bz-s2);
        padding: var(--bz-s3);
        border: 1px dashed var(--bz-line-strong);
        border-radius: var(--bz-r-md);
        background: var(--bz-bg);
        font-family: var(--bz-font-mono);
        font-size: var(--bz-size-sm);
        word-break: break-all;
      }

      /* Toast */
      .toasts {
        position: fixed;
        right: var(--bz-s5);
        bottom: calc(var(--bz-ledge) + var(--bz-s4));
        z-index: 90;
        display: grid;
        gap: var(--bz-s2);
        justify-items: end;
      }

      .toast {
        display: flex;
        align-items: center;
        gap: var(--bz-s3);
        padding: var(--bz-s3) var(--bz-s4);
        border: 1px solid var(--bz-line-strong);
        border-radius: var(--bz-r-md);
        background: var(--bz-surface);
        box-shadow: var(--bz-shadow-overlay);
        font-size: var(--bz-size-sm);
        animation: bz-toast-in var(--bz-d-slow) var(--bz-ease-out) both;
      }

      .toast.is-leaving {
        animation: bz-toast-out var(--bz-d-fast) var(--bz-ease-out-soft) both;
      }

      /* Token gallery (design-system extraction aid) */
      .swatches {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr));
        gap: var(--bz-s3);
        margin-top: var(--bz-s4);
      }

      .swatch {
        display: grid;
        gap: var(--bz-s2);
        padding: var(--bz-s3);
        border: 1px solid var(--bz-line);
        border-radius: var(--bz-r-md);
        background: var(--bz-surface);
      }

      .swatch__chip {
        height: 2.25rem;
        border: 1px solid var(--bz-line-strong);
        border-radius: var(--bz-r-sm);
      }

      .swatch__name {
        font-family: var(--bz-font-mono);
        font-size: var(--bz-size-micro);
      }

      .swatch__use {
        color: var(--bz-ink-muted);
        font-size: var(--bz-size-micro);
      }

      /* ---------------------------------------------------------------
         7. MOTION — keyframes + entrances + reduced motion
         --------------------------------------------------------------- */
      @keyframes bz-rise {
        from {
          opacity: 0;
          transform: translateY(var(--bz-lift));
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes bz-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes bz-toast-in {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes bz-toast-out {
        from {
          opacity: 1;
          transform: translateY(0);
        }
        to {
          opacity: 0;
          transform: translateY(4px);
        }
      }

      /* Route entrance: staggered only across a handful of blocks, so the
         app never feels like it is performing for the user. */
      .canvas > .measure > * {
        animation: bz-rise var(--bz-d-base) var(--bz-ease-out) both;
      }

      .canvas > .measure > *:nth-child(2) {
        animation-delay: 24ms;
      }

      .canvas > .measure > *:nth-child(3) {
        animation-delay: 48ms;
      }

      .canvas > .measure > *:nth-child(n + 4) {
        animation-delay: 64ms;
      }

      /* In-place updates (filtering, resolving a case) must not replay the
         route entrance. Motion earns attention only when context changes. */
      .canvas.is-quiet > .measure > * {
        animation: none;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 1ms !important;
          animation-delay: 0ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 1ms !important;
          transition-delay: 0ms !important;
        }

        :root {
          --bz-press: 1;
          --bz-lift: 0px;
        }

        .drawer,
        .palette,
        .setup {
          transform: none !important;
        }

        /* A looping spinner is the one thing the blanket override would make
           worse, so it stops entirely and the surrounding copy carries the
           progress instead. */
        .spinner {
          animation: none !important;
          border-color: var(--bz-accent);
        }
      }

      /* ---------------------------------------------------------------
         RESPONSIVE — spine collapses to a top bar of glyphs
         --------------------------------------------------------------- */
      @media (max-width: 60rem) {
        .grid2,
        .case__body {
          grid-template-columns: minmax(0, 1fr);
        }

        .case__decide {
          padding-left: 0;
          border-left: 0;
          border-top: 1px solid var(--bz-line);
          padding-top: var(--bz-s3);
        }

        .row {
          grid-template-columns: 3rem minmax(0, 1fr) 6.5rem;
        }

        .row__meta,
        .row__cat,
        .row__state {
          display: none;
        }

        .setup {
          grid-template-columns: minmax(0, 1fr);
        }

        .setup__aside {
          display: none;
        }
      }

      @media (max-width: 44rem) {
        .shell {
          grid-template-columns: minmax(0, 1fr);
        }

        .spine {
          position: sticky;
          flex-direction: row;
          height: auto;
          padding: var(--bz-s2) var(--bz-s3);
          border-right: 0;
          border-bottom: 1px solid var(--bz-line);
        }

        .spine__mark {
          margin-bottom: 0;
        }

        .spine__tip {
          display: none;
        }

        .ledge {
          left: 0;
        }

        .topbar {
          grid-template-columns: auto minmax(0, 1fr);
          gap: var(--bz-s2);
          padding: 0 var(--bz-s3);
        }

        .topbar__where,
        .sync {
          display: none;
        }

        /* The command trigger becomes a glyph: the keyboard shell is a
           desktop affordance, and touch users get the spine instead. */
        .cmdtrigger {
          width: 2rem;
          padding: 0;
          justify-content: center;
        }

        .cmdtrigger > *:not(:first-child) {
          display: none;
        }

        .ledge__hint {
          display: none;
        }

        .ledge__hint:last-child {
          display: inline-flex;
        }

        .toasts {
          left: var(--bz-s4);
          right: var(--bz-s4);
        }

        .toast {
          width: 100%;
        }

        .figure__value {
          font-size: var(--bz-size-display);
        }

        .canvas {
          padding: var(--bz-s5) var(--bz-s4) calc(var(--bz-ledge) + var(--bz-s8));
        }
      }
    </style>
  </head>

          status: "accepted",
          claims: 9,
          detail: "Accepted 12 Sep, 21:05",
        },
        {

          file: "apple-shortcut capture stream",

          period: "rolling",
          acc: "livefresh",
          status: "live",
          claims: 6,
          detail: "Last capture 13 Sep, 08:12",

      ];

      /* ---------------------------------------------------------------
         FORMAT
         --------------------------------------------------------------- */
      const MONTHS = [
        "Jan",
        "Feb",
        "Mar",
        "Apr",
        "May",
        "Jun",
        "Jul",
        "Aug",
        "Sep",
        "Oct",
        "Nov",
        "Dec",
      ];
      const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

      function money(value, opts) {
        const options = opts || {};
        const abs = Math.abs(value).toLocaleString("en-SG", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        });
        const prefix = value < 0 ? "−" : options.plus ? "+" : "";
        return prefix + (options.bare ? "" : "S$") + abs;
      }

      function plain(value) {
        return Math.abs(value).toLocaleString("en-SG", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        });
      }

      function dayNum(iso) {
        return Number(iso.slice(8, 10));
      }

      function shortDate(iso) {
        return dayNum(iso) + " " + MONTHS[Number(iso.slice(5, 7)) - 1];
      }

      function longDate(iso) {
        const date = new Date(iso + "T12:00:00Z");
        return (
          DAYS[date.getUTCDay()] +
          " " +
          dayNum(iso) +
          " " +
          MONTHS[Number(iso.slice(5, 7)) - 1] +
          " " +
          iso.slice(0, 4)
        );
      }

      function dayLabel(iso) {
        if (iso === TODAY) return "Today · " + shortDate(iso);
        if (dayNum(iso) === dayNum(TODAY) - 1)
          return "Yesterday · " + shortDate(iso);
        return longDate(iso);
      }

      function esc(text) {
        return String(text).replace(
          /[&<>"']/g,
          (ch) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[ch],
        );
      }

      const ICONS = {
        overview: '<path d="M3 13.2V8.4M8 13.2V3.2M13 13.2v-3.6"/>',
        transactions:
          '<path d="M2.6 4.5h10.8M2.6 8.5h10.8M2.6 12.5h6.4"/>',
        review:
          '<path d="M2.5 9.5h3.1l1 1.9h2.8l1-1.9h3.1M2.5 9.5 4.6 3.3h6.8l2.1 6.2v3.3a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1z"/>',
        imports:
          '<path d="M8 2.6v6.9m0 0 2.4-2.4M8 9.5 5.6 7.1M2.6 11.4v1.2a1 1 0 0 0 1 1h8.8a1 1 0 0 0 1-1v-1.2"/>',
        tokens:
          '<path d="M2.6 3.2h4.6v4.6H2.6zM8.8 8.2h4.6v4.6H8.8z"/><circle cx="11.1" cy="5.5" r="2.3"/><circle cx="4.9" cy="10.5" r="2.3"/>',
        close: '<path d="M4 4l8 8M12 4l-8 8"/>',
        check: '<path d="M3.4 8.6l3 3 6.2-7.2"/>',

      function icon(name) {
        return (
          '<svg aria-hidden="true" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">' +
          ICONS[name] +
          "</svg>"
        );
      }

      /* ---------------------------------------------------------------
         STATE
         --------------------------------------------------------------- */
      const NAV = [
        { id: "overview", label: "Overview", key: "O", icon: "overview" },
        {
          id: "transactions",
          label: "Transactions",
          key: "T",
          icon: "transactions",

        { id: "imports", label: "Imports", key: "I", icon: "imports" },
        { id: "tokens", label: "Design tokens", key: "D", icon: "tokens" },

      const state = {
        route: "overview",
        cursor: 0,

        palette: { open: false, query: "", index: 0, items: [] },
        setup: { open: false, step: 0, done: false, data: {} },

      };

      const reduced = window.matchMedia("(prefers-reduced-motion: reduce)");

      function pendingReviews() {
        return REVIEWS.filter((review) => !state.resolved[review.id]);
      }

      function reviewFor(id) {
        return REVIEWS.find((review) => review.id === id) || null;
      }

      function txFor(id) {
        return TX.find((tx) => tx.id === id) || null;
      }

      function claimFor(id) {
        return CLAIMS_UNMATCHED.find((claim) => claim.id === id) || null;
      }

      function effectiveCategory(tx) {
        const decided = state.resolved[tx.review];
        if (decided && decided.category) return decided.category;
        return tx.cat;
      }

      function txNeedsReview(tx) {
        return Boolean(tx.review) && !state.resolved[tx.review];
      }

      /* Month arithmetic is derived, never hardcoded, so decisions made in
         the review inbox move the numbers on Overview. */
      function monthTotals() {
        let confirmed = 0;
        let provisional = 0;
        let income = 0;
        let offsets = 0;
        for (const tx of TX) {
          if (tx.kind === "Income") {
            income += tx.amt;
            continue;
          }
          if (tx.kind === "Transfer") continue;
          if (tx.kind === "Refund" || tx.kind === "Reimbursement") {
            offsets += tx.amt;
            continue;
          }
          if (tx.state === "provisional") provisional += Math.abs(tx.amt);
          else confirmed += Math.abs(tx.amt);
        }
        return {
          confirmed,
          provisional,
          income,
          offsets,
          estimated: confirmed + provisional - offsets,
        };
      }

      function categoryTotals() {
        const bucket = new Map();
        for (const tx of TX) {
          if (tx.kind !== "Expense") continue;
          const name = effectiveCategory(tx) || "Uncategorized";
          bucket.set(name, (bucket.get(name) || 0) + Math.abs(tx.amt));
        }
        return [...bucket.entries()]
          .map(([name, total]) => ({ name, total }))
          .sort((a, b) => b.total - a.total);
      }

      function dailyTotals() {
        const days = [];
        for (let day = 1; day <= 13; day += 1) {
          const iso = "2026-09-" + String(day).padStart(2, "0");
          const spend = TX.filter(
            (tx) => tx.d === iso && tx.kind === "Expense",
          ).reduce((sum, tx) => sum + Math.abs(tx.amt), 0);
          const isProvisional = TX.some(
            (tx) => tx.d === iso && tx.state === "provisional",
          );
          days.push({ day, iso, spend, isProvisional });
        }
        return days;
      }

      /* ---------------------------------------------------------------
         TOASTS
         --------------------------------------------------------------- */
      function toast(message, tone) {
        const host = document.getElementById("toasts");
        const node = document.createElement("div");
        node.className = "toast";
        const glyph =
          tone === "confirmed"
            ? '<span style="color:var(--bz-confirmed)">' +
              icon("check") +
              "</span>"
            : '<span class="bz-muted">' + icon("arrow") + "</span>";
        node.innerHTML = glyph + "<span>" + esc(message) + "</span>";
        host.append(node);
        const life = reduced.matches ? 1600 : 2600;
        window.setTimeout(() => {
          node.classList.add("is-leaving");
          window.setTimeout(() => node.remove(), reduced.matches ? 10 : 140);
        }, life);
      }

      /* ---------------------------------------------------------------
         SHELL CHROME
         --------------------------------------------------------------- */
      function renderSpine() {
        const pending = pendingReviews().length;
        const items = NAV.map((item) => {
          const current = state.route === item.id ? ' aria-current="page"' : "";

              : "";
          return (
            '<button class="spine__btn" data-act="route" data-arg="' +
            item.id +

            current +
            ' aria-label="' +
            item.label +
            '">' +
            icon(item.icon) +
            dot +
            '<span class="spine__tip">' +
            item.label +
            '<span class="kbd">g</span><span class="kbd">' +

          );
        }).join("");

        document.getElementById("spine").innerHTML =
          '<div class="spine__mark" title="Billzebub">B</div>' +
          items +
          '<div class="spine__spacer"></div>' +
          '<button class="spine__btn" data-act="setup" type="button" aria-label="Setup">' +
          '<svg aria-hidden="true" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="8" cy="8" r="2.3"/><path d="M8 1.8v1.6M8 12.6v1.6M1.8 8h1.6M12.6 8h1.6M3.6 3.6l1.1 1.1M11.3 11.3l1.1 1.1M12.4 3.6l-1.1 1.1M4.7 11.3l-1.1 1.1"/></svg>' +
          '<span class="spine__tip">Setup</span></button>';
      }

      function renderTopbar() {
        const title = NAV.find((item) => item.id === state.route).label;
        document.getElementById("where").innerHTML =
          "<b>Billzebub</b>" +
          '<span class="topbar__sep">/</span>' +
          "<span>" +
          title +
          "</span>" +
          '<span class="badge badge--quiet">SGD</span>';

        const pending = pendingReviews().length;
        const setupLabel = state.setup.done
          ? "Setup complete"
          : "Finish setup";
        document.getElementById("topbar-right").innerHTML =
          (pending > 0
            ? '<button class="pill is-on" data-act="route" data-arg="review" type="button">' +
              pending +
              " Pending Review</button>"
            : '<span class="pill"><span style="color:var(--bz-confirmed)">' +
              icon("check") +
              "</span>Inbox clear</span>") +
          '<span class="sync"><span class="sync__dot"></span>Synced 08:14</span>' +
          '<button class="btn" data-act="setup" type="button">' +
